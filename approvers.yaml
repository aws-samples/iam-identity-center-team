# TEAM approver policies — source of truth, synced to DynamoDB by scripts/sync_team_policies.py.
# Explicit entries here are written as OU-level records (teamRouter resolves approvers from account-level records only).
# When GITHUB_TOKEN is set, the sync script also writes per-account entries derived from
# each account's admin_team_name tag → governance_group_name in team-resource-mapping.yaml.
# Per-account entries take precedence over these OU-level fallbacks.
#
# Non-production OUs (Sandbox, Staging, Security, Suspended) are intentionally omitted —
# TEAM eligibility is restricted to production and zone OUs only.

approver_mappings:
  # Root and production/zone OUs — CET is the fallback approver for any account
  # that does not have a per-account owner entry written by the sync script.
