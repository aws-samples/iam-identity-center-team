# TEAM eligibility policies — source of truth, synced to DynamoDB by scripts/sync_team_policies.py.
# Fields: permission_sets (list) or permission_set (single), (account_id | ou_ids), max_duration (ISO 8601), requestable_by, approval_required
#
# NOTE: User-level eligibility policies (e.g. SAmle@flexera.com) are managed directly
# via the TEAM admin UI and are NOT managed here. Only group-level policies are managed as code.
#
# OU IDs (production and zone only — sandbox/staging/security/suspended are excluded):
#   r-c0au              = Root (avoid — causes 40s+ load time due to full org traversal)
#   ou-c0au-rb7od08q    = Account Type: Production
#   ou-c0au-4pauetly    = Zone: APAC
#   ou-c0au-dau1fvhk    = Zone: APAC-UnrestrictedRegions
#   ou-c0au-xwpsjxoo    = Zone: EU
#   ou-c0au-su7jde0e    = Zone: EU-UnrestrictedRegions
#   ou-c0au-25oc0u9i    = Zone: US
#   ou-c0au-lrz2m367    = Zone: US-UnrestrictedRegions

